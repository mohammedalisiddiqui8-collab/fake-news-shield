<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veritas - Black Ivory</title>
  <script>
    /* The stored theme, applied before first paint so the page never flashes
       the wrong edition. Defaults to the dark Veritas canvas; every colour it
       selects comes from the token system in src/index.css — it sets the
       class and nothing else, so both editions live in one place. */
    (function () {
      try {
        if (localStorage.getItem("veritas-theme") !== "light") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
